name: Deploy to EC2

on:
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # Build - verify the app installs cleanly
  # ---------------------------------------------------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint (advisory - never blocks deploy)
        run: npm run lint || true
        continue-on-error: true

      - name: Run tests (if defined)
        run: npm test --if-present || true
        continue-on-error: true

  # ---------------------------------------------------------------------------
  # Deploy - provision infra with Terraform, configure with Ansible
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build

    env:
      TF_WORKING_DIR: terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---- AWS credentials --------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # ---- Generate an ephemeral SSH key pair for this deploy ---------------
      - name: Generate SSH key pair
        run: |
          ssh-keygen -t ed25519 -C "deploy@ci" -f "$HOME/.ssh/deploy_key" -N ""
          echo "SSH_PUBLIC_KEY=$(cat $HOME/.ssh/deploy_key.pub)" >> "$GITHUB_ENV"
          echo "SSH_PRIVATE_KEY_PATH=$HOME/.ssh/deploy_key"      >> "$GITHUB_ENV"
          chmod 600 "$HOME/.ssh/deploy_key"

      # ---- Terraform: init --------------------------------------------------
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"
          terraform_wrapper: false

      - name: Terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ secrets.AWS_REGION }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate"

      # ---- Terraform: plan & apply ------------------------------------------
      - name: Terraform plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform plan \
            -var="aws_region=${{ secrets.AWS_REGION }}" \
            -var="project_name=${{ secrets.PROJECT_NAME }}" \
            -var="public_key=${SSH_PUBLIC_KEY}" \
            -out=tfplan

      - name: Terraform apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -auto-approve tfplan

      # ---- Capture Terraform outputs ----------------------------------------
      - name: Capture Terraform outputs
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          SERVER_IP=$(terraform output -raw instance_public_ip)
          APP_URL=$(terraform output -raw app_url)
          echo "SERVER_IP=${SERVER_IP}" >> "$GITHUB_ENV"
          echo "APP_URL=${APP_URL}"     >> "$GITHUB_ENV"

      # ---- Wait for SSH to become available ---------------------------------
      - name: Wait for SSH
        run: |
          echo "Waiting for SSH on ${SERVER_IP}..."
          for i in $(seq 1 30); do
            if ssh -o StrictHostKeyChecking=no \
                   -o ConnectTimeout=5 \
                   -o BatchMode=yes \
                   -i "${SSH_PRIVATE_KEY_PATH}" \
                   ubuntu@"${SERVER_IP}" true 2>/dev/null; then
              echo "SSH is up."
              exit 0
            fi
            echo "Attempt ${i}/30 - sleeping 10s..."
            sleep 10
          done
          echo "ERROR: SSH did not become available in time." >&2
          exit 1

      # ---- Ansible: install & run playbook ----------------------------------
      - name: Install Ansible
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ansible

      - name: Run Ansible playbook
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          ansible-playbook \
            -i "${SERVER_IP}," \
            -u ubuntu \
            --private-key "${SSH_PRIVATE_KEY_PATH}" \
            ansible/playbook.yml \
            --extra-vars "app_dir=/home/ubuntu/app \
                          db_name=appdb \
                          db_user=appuser \
                          db_password=${{ secrets.DB_PASSWORD || 'changeme_secret_123' }} \
                          node_env=production \
                          app_port=3000"

      # ---- Self-verify: hit the public endpoint ----------------------------
      - name: Smoke test - verify app is reachable
        run: |
          echo "Smoke-testing ${APP_URL}/health ..."
          for i in $(seq 1 12); do
            STATUS=$(curl -o /dev/null -s -w "%{http_code}" \
                         --max-time 10 \
                         "${APP_URL}/health" || echo "000")
            echo "Attempt ${i}/12 - HTTP ${STATUS}"
            if echo "${STATUS}" | grep -qE '^[23][0-9]{2}$'; then
              echo "SUCCESS: app returned HTTP ${STATUS}"
              exit 0
            fi
            sleep 10
          done
          echo "ERROR: smoke test failed - app did not return 2xx/3xx." >&2
          exit 1

      # ---- Store deploy info as summary ------------------------------------
      - name: Write job summary
        if: always()
        run: |-
          echo "### Deploy summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Server IP**: ${SERVER_IP}"  >> "$GITHUB_STEP_SUMMARY"
          echo "- **App URL**: ${APP_URL}"       >> "$GITHUB_STEP_SUMMARY"
